# Fonte de dados LOCAL de desenvolvimento: o "sistema da TransBrasil".
# Postgres 16 (paridade com o Neon). Suba com: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: transbrasil-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transbrasil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transbrasil}
      POSTGRES_DB: ${POSTGRES_DB:-transbrasil}
    ports:
      - "5432:5432"
    # o padrão do Docker é 64 MB de /dev/shm, e o Postgres usa memória
    # compartilhada para consultas paralelas: com as tabelas deste projeto
    # (milhões de linhas), agregações paralelas estouram esse limite
    shm_size: 1gb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transbrasil} -d ${POSTGRES_DB:-transbrasil}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
