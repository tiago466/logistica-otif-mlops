[project]
name = "logistica-otif-mlops"
version = "0.1.0"
description = "Ciência de Dados e MLOps end-to-end em logística (dados sintéticos): previsão de atraso (OTIF) e análise de custos de transporte — pipeline medallion, MLflow, testes/CI e monitoramento de drift."
readme = "README.md"
authors = [
    { name = "Tiago Lima", email = "tiago.p.limm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.14.2",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
logistica-otif-mlops = "logistica_otif_mlops:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mypy>=2.3.0",
    "nbconvert>=7.17.1",
    "pandas-stubs>=3.0.3.260530",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I import-sort, N nomes, UP moderniza,
# B bugbear, SIM simplificações.
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# migrations sao codigo GERADO pelo alembic: estilo do template dele nao nos bloqueia
"migrations/versions/*" = ["E501", "I001", "UP007", "UP035"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
